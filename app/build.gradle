plugins { id 'com.android.application' }
def stableKeystorePath = System.getenv('AI_TRAINER_KEYSTORE')
android {
    namespace 'com.yellowblitz.trainer'
    compileSdk 35
    signingConfigs {
        stableDebug {
            if (stableKeystorePath) {
                storeFile file(stableKeystorePath)
                storePassword 'android'
                keyAlias 'trainerdev'
                keyPassword 'android'
            }
        }
    }
    defaultConfig { applicationId 'com.yellowblitz.trainer.deepseekexp'; minSdk 26; targetSdk 35; versionCode 24; versionName '0.15.0-deepseek-exp' }
    buildTypes {
        debug {
            if (stableKeystorePath) signingConfig signingConfigs.stableDebug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


dependencies {
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
}
