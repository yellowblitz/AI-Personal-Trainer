name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Browser UI smoke test
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: trainer-ui-preview
          path: trainer-preview.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.android/ai-personal-trainer-debug.jks
          key: ai-personal-trainer-debug-signing-v1
      - name: Ensure stable development signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/ai-personal-trainer-debug.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/ai-personal-trainer-debug.jks" \
              -storepass android \
              -keypass android \
              -alias trainerdev \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AI Personal Trainer Development,O=yellowblitz,C=US"
          fi
          echo "AI_TRAINER_KEYSTORE=$HOME/.android/ai-personal-trainer-debug.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$HOME/.android/ai-personal-trainer-debug.jks" -storepass android -alias trainerdev | grep -E "SHA256:|Valid from"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Trainer-0.7.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
